<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#ffffff"/>
  <ellipse cx="150" cy="273" rx="65" ry="9" fill="#e0e0e0"/>
  <!-- Amul Tetra Pak carton -->
  <!-- Carton body -->
  <rect x="85" y="50" width="128" height="210" rx="8" fill="#1565C0"/>
  <!-- White panel in middle -->
  <rect x="93" y="110" width="112" height="100" rx="6" fill="#ffffff"/>
  <!-- Top gable -->
  <polygon points="85,50 150,20 215,50" fill="#0D47A1"/>
  <!-- AMUL logo -->
  <rect x="93" y="118" width="112" height="32" rx="5" fill="#EF6C00"/>
  <text x="149" y="140" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="3">AMUL</text>
  <!-- Taaza text -->
  <text x="149" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#1565C0" letter-spacing="1">Taaza</text>
  <!-- Toned Milk text -->
  <text x="149" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555" font-weight="600">Toned Milk</text>
  <!-- White wave decoration -->
  <path d="M93 205 Q125 195 149 205 Q173 215 211 205 L211 210 Q173 220 149 210 Q125 200 93 210 Z" fill="#1565C0" opacity="0.15"/>
  <!-- Bottom text -->
  <text x="149" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#bbdefb" font-weight="600">Fat 3% | SNF 8.5%</text>
  <!-- Volume -->
  <text x="149" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#90CAF9" font-weight="700">500 ml</text>
</svg>
