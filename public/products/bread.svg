<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#ffffff"/>
  <ellipse cx="150" cy="272" rx="80" ry="10" fill="#e0e0e0"/>
  <!-- Bread packet — clear plastic bag look -->
  <!-- Bag shape -->
  <rect x="55" y="45" width="188" height="215" rx="16" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2"/>
  <!-- Bread loaf illustration inside bag -->
  <rect x="75" y="100" width="148" height="100" rx="12" fill="#FFCC80"/>
  <rect x="75" y="100" width="148" height="22" rx="12" fill="#FF8F00"/>
  <rect x="75" y="112" width="148" height="10" fill="#FF8F00"/>
  <!-- Slices detail -->
  <line x1="105" y1="100" x2="105" y2="200" stroke="#FFB74D" stroke-width="2"/>
  <line x1="135" y1="100" x2="135" y2="200" stroke="#FFB74D" stroke-width="2"/>
  <line x1="165" y1="100" x2="165" y2="200" stroke="#FFB74D" stroke-width="2"/>
  <line x1="195" y1="100" x2="195" y2="200" stroke="#FFB74D" stroke-width="2"/>
  <!-- Britannia logo red band at top -->
  <rect x="55" y="45" width="188" height="50" rx="16" fill="#C62828"/>
  <rect x="55" y="80" width="188" height="15" fill="#C62828"/>
  <!-- BRITANNIA text -->
  <text x="150" y="76" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="2">BRITANNIA</text>
  <!-- Bread type label -->
  <rect x="70" y="210" width="158" height="32" rx="10" fill="#C62828"/>
  <text x="150" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">100% Whole Wheat</text>
  <!-- Weight -->
  <text x="150" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#aaa">400g</text>
</svg>
