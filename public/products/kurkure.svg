<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#ffffff"/>
  <ellipse cx="150" cy="272" rx="75" ry="10" fill="#e0e0e0"/>
  <!-- Kurkure packet — red/orange diagonal design -->
  <!-- Packet shape (slightly angled for dynamism) -->
  <rect x="55" y="35" width="185" height="225" rx="22" fill="#E53935"/>
  <!-- Top gradient overlay -->
  <rect x="55" y="35" width="185" height="80" rx="22" fill="#FF7043"/>
  <rect x="55" y="95" width="185" height="20" fill="#FF7043"/>
  <!-- Diagonal yellow streak -->
  <polygon points="55,180 240,100 240,130 55,210" fill="#FFC107" opacity="0.3"/>
  <!-- KURKURE logo -->
  <text x="148" y="92" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="30" font-weight="900" fill="#FFD600" letter-spacing="1" stroke="#D32F2F" stroke-width="1">KURKURE</text>
  <!-- Puffcorn illustration -->
  <ellipse cx="150" cy="155" rx="45" ry="28" fill="#FF8F00" opacity="0.6"/>
  <ellipse cx="128" cy="148" rx="18" ry="12" fill="#FFCA28" opacity="0.9"/>
  <ellipse cx="152" cy="160" rx="16" ry="10" fill="#FFD54F" opacity="0.9"/>
  <ellipse cx="173" cy="147" rx="17" ry="11" fill="#FFCA28" opacity="0.9"/>
  <!-- Masala Munch text -->
  <rect x="75" y="188" width="148" height="28" rx="14" fill="#FF8F00"/>
  <text x="150" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">MASALA MUNCH</text>
  <!-- PepsiCo small text -->
  <text x="150" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#FF7043" font-weight="600">PepsiCo</text>
  <text x="150" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#aaa">41.5g</text>
</svg>
